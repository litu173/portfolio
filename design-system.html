<!doctype html>
<html lang="en" data-theme="dark" data-vision="default" data-contrast="normal" data-motion="full" data-fx="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Design System — Mutaher Hossain</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css" id="tokens-link">
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    /* Design-system chrome (ds-*) — styled with the same tokens it edits */
    body.ds { display: grid; grid-template-columns: 232px minmax(0, 1fr) 380px; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
    .ds-top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg-2); flex-wrap: wrap; }
    .ds-top__brand { display: flex; align-items: center; gap: 12px; }
    .ds-top__brand b { font: var(--fw-display) 18px var(--f-display); letter-spacing: -.02em; }
    .ds-top__brand small { display: block; color: var(--text-2); font-size: 12px; }
    .ds-top__brand small.dirty { color: var(--warm); }
    .ds-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ds-actions .btn { --h: 38px; padding: 0 14px; font-size: .85rem; }
    .ds-nav { overflow: auto; border-right: 1px solid var(--line); padding: 18px 12px; background: var(--bg-2); }
    .ds-nav p { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: 14px 10px 6px; }
    .ds-nav a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--text-2); font-size: 14px; }
    .ds-nav a:hover, .ds-nav a[aria-current] { background: var(--surface-2); color: var(--text); }
    .ds-main { overflow: auto; padding: 40px clamp(20px, 3vw, 56px) 160px; scroll-behavior: smooth; }
    .ds-main > section { margin-bottom: 88px; scroll-margin-top: 24px; }
    .ds-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 28px; }
    .ds-h h2 { font: var(--fw-display) 32px/1 var(--f-display); letter-spacing: -.03em; }
    .ds-h p { color: var(--text-2); font-size: 14px; max-width: 60ch; }
    .ds-intro h1 { font: var(--fw-display) clamp(40px, 5vw, 80px)/.95 var(--f-display); letter-spacing: -.045em; }
    .ds-intro p { color: var(--text-2); max-width: 62ch; margin-top: 16px; }
    .ds-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .ds-swatch { text-align: left; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg-2); cursor: pointer; padding: 0; color: var(--text); }
    .ds-swatch__c { height: 84px; border-bottom: 1px solid var(--line); background-image: linear-gradient(45deg, rgba(128,128,128,.15) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.15) 75%), linear-gradient(45deg, rgba(128,128,128,.15) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.15) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; position: relative; }
    .ds-swatch__c i { position: absolute; inset: 0; }
    .ds-swatch__m { padding: 10px 12px; display: grid; gap: 2px; }
    .ds-swatch__m b { font: 500 13px var(--f-body); }
    .ds-swatch__m code, .ds-code, .ds-tok code { font: 12px var(--f-mono); color: var(--text-2); }
    .ds-spec { position: relative; border: 1px solid var(--line); border-radius: 20px; padding: 28px; background: var(--bg); margin-bottom: 16px; cursor: pointer; transition: border-color .25s, box-shadow .25s; }
    .ds-spec:hover { border-color: var(--line-2); }
    .ds-spec.is-sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .ds-spec__label { position: absolute; top: -10px; left: 18px; padding: 2px 10px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
    .ds-spec.is-sel .ds-spec__label { border-color: var(--accent); color: var(--accent); }
    .ds-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .ds-stage .wcard { position: relative; top: auto; }
    .ds-stage .wcard__link { min-height: 420px; }
    .ds-stage .pillar { width: 100%; max-width: 520px; min-height: 0; }
    .ds-stage .service { min-height: 0; max-width: 420px; }
    .ds-stage .marquee { margin-top: 0; }
    .editing .ds-stage [contenteditable] { outline: 1px dashed var(--line-2); outline-offset: 4px; }
    .ds-type-row { display: grid; grid-template-columns: 140px 1fr; gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .ds-type-row:hover { background: var(--surface); }
    .ds-type-row code { font: 12px var(--f-mono); color: var(--text-2); }
    .ds-scale { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
    .ds-scale div { display: grid; gap: 8px; justify-items: center; font: 11px var(--f-mono); color: var(--text-2); cursor: pointer; }
    .ds-scale i { display: block; background: var(--accent); opacity: .8; }

    .ds-insp { overflow: auto; border-left: 1px solid var(--line); background: var(--bg-2); padding: 20px; }
    .ds-insp h3 { font: var(--fw-display) 22px/1.1 var(--f-display); letter-spacing: -.02em; margin-bottom: 6px; }
    .ds-insp .ds-desc { color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
    .ds-insp h4 { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: 22px 0 10px; }
    .ds-tok { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--bg); }
    .ds-tok__h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .ds-tok__h b { font-size: 13px; font-weight: 600; }
    .ds-ctl { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; }
    .ds-ctl span { font: 11px var(--f-mono); color: var(--text-3); }
    .ds-ctl .in { display: flex; gap: 6px; align-items: center; min-width: 0; }
    .ds-ctl input[type=text], .ds-ctl select { flex: 1; min-width: 0; height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); padding: 0 8px; font: 12px var(--f-mono); }
    .ds-ctl input[type=color] { width: 36px; height: 34px; padding: 2px; border-radius: 8px; border: 1px solid var(--line-2); background: none; flex: none; }
    .ds-ctl input[type=range] { width: 100%; accent-color: var(--accent); }
    .ds-cr { font: 11px var(--f-mono); color: var(--text-2); }
    .ds-cr.bad { color: #FF8A80; }
    .ds-code { display: block; white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; max-height: 240px; overflow: auto; }
    .ds-list { padding-left: 18px; list-style: disc; color: var(--text-2); font-size: 13px; display: grid; gap: 4px; }
    .ds-empty { color: var(--text-2); font-size: 14px; }
    .ds-toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0; transition: .3s; padding: 10px 18px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; pointer-events: none; z-index: 50; }
    .ds-toast.on { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1100px) { body.ds { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; height: auto; overflow: auto; } .ds-nav { display: none; } .ds-insp { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
</head>
<body class="ds" data-no-palette>
  <header class="ds-top">
    <div class="ds-top__brand"><span class="nav__mono">MH</span><div><b>Design System</b><small data-ds-status>Click any token or component to edit it — changes apply to every page once saved.</small></div></div>
    <div class="ds-actions">
      <button class="btn btn--ghost" type="button" data-ds="theme"><span class="btn__label"><span class="btn__text" data-text="Light / Dark">Light / Dark</span></span></button>
      <button class="btn btn--ghost" type="button" data-ds="edit" aria-pressed="false"><span class="btn__label"><span class="btn__text" data-text="Edit copy">Edit copy</span></span></button>
      <button class="btn btn--ghost" type="button" data-ds="undo" aria-label="Undo">↶</button>
      <button class="btn btn--ghost" type="button" data-ds="redo" aria-label="Redo">↷</button>
      <button class="btn btn--ghost" type="button" data-ds="palette"><span class="btn__label"><span class="btn__text" data-text="Import palette lab">Import palette lab</span></span></button>
      <button class="btn btn--ghost" type="button" data-ds="reset"><span class="btn__label"><span class="btn__text" data-text="Revert">Revert</span></span></button>
      <button class="btn btn--ghost" type="button" data-ds="css"><span class="btn__label"><span class="btn__text" data-text="tokens.css ↓">tokens.css ↓</span></span></button>
      <button class="btn btn--ghost" type="button" data-ds="md"><span class="btn__label"><span class="btn__text" data-text="DESIGN-SYSTEM.md ↓">DESIGN-SYSTEM.md ↓</span></span></button>
      <button class="btn btn--primary" type="button" data-ds="save"><span class="btn__label"><span class="btn__text" data-text="Save to site">Save to site</span></span></button>
    </div>
  </header>
  <nav class="ds-nav" aria-label="Design system sections" data-ds-nav></nav>
  <main class="ds-main" id="ds-main" data-ds-main></main>
  <aside class="ds-insp" aria-label="Inspector" data-ds-insp aria-live="polite"></aside>
  <div class="ds-toast" role="status"></div>
  <script src="palette-lab.js?v=2"></script>
  <script src="save.js?v=2"></script>
  <script src="ds.js?v=3"></script>
</body>
</html>
