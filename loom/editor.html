<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Loom Editor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="loom.css?v=5">
</head>
<body>
  <div class="ed" id="ed">
    <header class="top">
      <a class="logo" href="app.html" title="All projects"><i aria-hidden="true"></i>Loom</a>
      <span class="top__sep"></span>
      <button class="btn btn--ghost top__proj" type="button" data-act="rename" title="Rename project"></button>
      <select class="top__page in" data-page-select aria-label="Current page" style="width:auto;height:28px"></select>
      <div class="top__mid">
        <div class="seg" role="group" aria-label="Breakpoint" data-bps></div>
        <span class="top__w" data-width></span>
      </div>
      <span class="top__status" data-status>Saved</span>
      <button class="ico" type="button" data-act="undo" title="Undo (⌘Z)" aria-label="Undo"></button>
      <button class="ico" type="button" data-act="redo" title="Redo (⇧⌘Z)" aria-label="Redo"></button>
      <button class="ico" type="button" data-act="preview" title="Preview (Esc to exit)" aria-label="Preview" aria-pressed="false"></button>
      <button class="btn" type="button" data-act="save" title="Save (⌘S)">Save</button>
      <button class="btn btn--blue" type="button" data-act="publish">Publish</button>
      <div data-user style="margin-left:4px"></div>
    </header>
    <nav class="rail" aria-label="Panels" data-rail></nav>
    <aside class="left" aria-label="Left panel" data-left></aside>
    <main class="stage" data-stage>
      <div class="stage__wrap" data-wrap><div class="stage__frame" data-frame><iframe title="Canvas" data-canvas></iframe></div></div>
    </main>
    <div class="crumbs" data-crumbs aria-label="Selected element path"></div>
    <aside class="right" aria-label="Right panel" data-right></aside>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
  <div class="modal" data-modal hidden><div class="modal__box" data-modal-box></div></div>
  <script src="../save.js?v=3"></script>
  <script src="core.js?v=4"></script>
  <script src="auth.js?v=1"></script>
  <script src="templates.js?v=3"></script>
  <script src="compose.js?v=2"></script>
  <script src="agents.js?v=2"></script>
  <script src="editor.js?v=4"></script>
  <script src="ai-panel.js?v=1"></script>
</body>
</html>
